name: Segurança da API

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Testes Java e autorização
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Executar testes sem depender do MySQL externo
        run: bash ./mvnw -B -ntp -Dtest=AuthControllerTest,VehicleErrorTest,VehicleSecurityTest,JwtFilterTest,JwtUtilTest,VehicleServiceTest,CryptoUtilsTest test
  sast:
    name: Análise estática Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install semgrep
      - name: Examinar o código Java
        run: semgrep scan --config p/java --error src/main/java

  secrets:
    name: Segredos no histórico Git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verificar histórico sem revelar segredos nos logs
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --no-banner --exit-code 1

