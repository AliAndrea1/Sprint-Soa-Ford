# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/autoinsight_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# SSL
server.ssl.enabled=false

# Segredos da aplicacao
app.jwt.secret=${JWT_SECRET:autoinsight-secret-key-ford-fiap-2026-secure-minimum-32-chars!!}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.crypto.key=${CRYPTO_KEY:AutoInsight2026F}

# CORS - origens permitidas
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:8081}